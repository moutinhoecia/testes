<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Frota | Moutinho</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#000;--card:#0e0e0e;--card2:#1a1a1a;--line:#2a2a2a;--tx:#e8eefc;--mut:#8ea0c0;--acc:#e30613;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yel:#facc15}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1280px;margin:auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px}h1 span{color:var(--acc)}.sub{color:var(--mut);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
select{max-width:100%}button:hover,select:hover{border-color:var(--acc)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut)}.pill.off{background:#3a1d1d;color:#ff8a8a}.pill.live{color:var(--green)}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.k .l{color:var(--mut);font-size:12px}.k .v{font-size:22px;font-weight:700;margin:4px 0;white-space:nowrap}.k .d{font-size:12px}
.up{color:var(--red)}.dn{color:var(--green)}.k.hl{background:linear-gradient(135deg,#e30613,#b30410);border:0}.k.hl .l,.k.hl .d{color:#fff}
.charts{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px}.cv{position:relative;height:280px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child,.tl{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--card2)}tfoot td{font-weight:700;border-top:2px solid var(--line)}
.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}.sc{max-height:420px;overflow:auto}
.empty{color:var(--mut);padding:18px;text-align:center}
@media(max-width:800px){.charts,.two{grid-template-columns:1fr}.wrap{padding:10px}.k .v{font-size:19px}.cv{height:250px}header .ctl{width:100%}header .ctl select{flex:1}}
.sec{margin:14px 0 8px;padding-left:10px;border-left:4px solid var(--acc);font-weight:700;font-size:15px}
.brand{display:flex;align-items:center;gap:14px}#logo{height:44px;max-width:190px;object-fit:contain}.wm{background:var(--acc);color:#fff;font-weight:800;letter-spacing:1px;padding:8px 12px;border-radius:8px;font-size:15px}
@media(max-width:800px){#logo{height:36px}}

.phead{display:none}
:root.pr{--bg:#fff;--card:#fff;--card2:#eee;--line:#999;--tx:#000;--mut:#333;--acc:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr .wrap{width:700px;max-width:700px;margin:0 auto;padding:0}.pr header{display:none}
.pr .phead{display:flex;align-items:center;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;font-size:14px}.pr .phead img{height:40px;filter:brightness(0)}
.pr .card{box-shadow:none;border:1px solid #888;break-inside:avoid;background:#fff}
.pr .k.hl{background:#fff;border:2px solid #000}.pr .k .l,.pr .k .v,.pr .k.hl .l,.pr .k.hl .d{color:#000}
.pr .d,.pr .d.up,.pr .d.dn,.pr .up,.pr .dn{color:#000;background:none;border:1px solid #666}
.pr th{background:#ddd;color:#000;border-bottom:2px solid #000}.pr td{border-color:#aaa}.pr tfoot td{border-top:2px solid #000}
.pr .sc{max-height:none;overflow:visible}.pr .tw{overflow:visible}.pr table{font-size:10px;white-space:normal}.pr th,.pr td{padding:5px 6px}.pr .k .v{font-size:17px}.pr .k{padding:10px}.pr .sec{border-color:#000!important;color:#000}
.pr .charts,.pr .two{grid-template-columns:1fr}.pr .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.pr .cv{height:230px}.pr .card:has(table){break-inside:auto}.pr tr{break-inside:avoid}.pr canvas{max-width:100%}.pr tr.cl:hover td{background:none}
@page{size:A4;margin:10mm}

/* ===== visual moderno + animações ===== */
[hidden]{display:none!important}
html:not(.pr) body{background:radial-gradient(900px 420px at 8% -8%,rgba(227,6,19,.16),transparent 62%),radial-gradient(800px 460px at 100% 0,rgba(59,130,246,.09),transparent 60%),var(--bg);background-attachment:fixed}
html:not(.pr) .card{background:linear-gradient(180deg,#131313,#0b0b0b);border-color:#262626;border-radius:16px}
.k .v{font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.sec{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) backwards}
#app.q .card,#app.q .sec{animation:none}
.k.hl{position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(227,6,19,.55)}
.k.hl::after{content:'';position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-130%);animation:shine 5s ease-in-out infinite;pointer-events:none}
.pill.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px;animation:pulse 1.8s infinite}
.tab,select,button,input[type=date],.chk{transition:border-color .2s,background .2s,transform .2s}
button:active{transform:scale(.97)}
input[type=date]{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;color-scheme:dark}
input[type=date]:hover,input[type=date]:focus{border-color:var(--acc);outline:0}
.chk{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);cursor:pointer;user-select:none}
.chk:hover{border-color:var(--acc)}
.chk input{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:99px;background:#3a3a3a;position:relative;cursor:pointer;transition:background .25s;margin:0;flex:none}
.chk input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s}
.chk input:checked{background:var(--acc)}.chk input:checked::after{transform:translateX(14px)}
.per{display:flex;flex-wrap:wrap;gap:6px;align-items:center;animation:slideIn .35s ease backwards}
@media(max-width:800px){.per{width:100%}.per input{flex:1}.chk{flex:1}}
@media(hover:hover){
.card{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.card:hover{transform:scale(1.025);border-color:rgba(227,6,19,.55);box-shadow:0 12px 34px -8px rgba(227,6,19,.35);position:relative;z-index:3}
.card.k:hover{transform:scale(1.045)}
.card:has(table):hover,.card:has(canvas):hover{transform:scale(1.008)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(230%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pr *,.pr *::before,.pr *::after{animation:none!important;transition:none!important;transform:none!important}
.pr .k.hl::after{display:none}.pr body{background:#fff}
@media print{*,*::before,*::after{animation:none!important;transition:none!important}}
